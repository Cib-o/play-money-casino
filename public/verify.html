<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_verify">შემოწმება</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="verify_heading"></h1>
    </div>
    <section class="panel">
      <p class="muted" data-t="verify_explain"></p>

      <div class="kv">
        <span class="k" data-t="verify_round_id"></span>
        <div class="inline">
          <input id="round-id" type="text" maxlength="64" class="num">
          <button class="btn ghost" id="load-round" data-t="verify_load"></button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label for="v-game" data-t="verify_game"></label>
          <select id="v-game">
            <option value="slots" data-t="game_slots"></option>
            <option value="roulette" data-t="game_roulette"></option>
            <option value="dice" data-t="game_dice"></option>
            <option value="blackjack" data-t="game_blackjack"></option>
          </select>
        </div>
        <div class="form-row" id="rtp-row">
          <label for="v-rtp" data-t="fair_rtp"></label>
          <input id="v-rtp" type="number" step="0.01" min="0.8" max="0.99" value="0.96" class="num">
        </div>
        <div class="form-row" id="machine-row">
          <label for="v-machine" data-t="verify_machine"></label>
          <select id="v-machine"></select>
        </div>
        <div class="form-row full">
          <label for="v-server-seed" data-t="verify_server_seed"></label>
          <input id="v-server-seed" type="text" maxlength="128" class="num">
        </div>
        <div class="form-row">
          <label for="v-client-seed" data-t="fair_client_seed"></label>
          <input id="v-client-seed" type="text" maxlength="64" class="num">
        </div>
        <div class="form-row">
          <label for="v-nonce" data-t="fair_nonce"></label>
          <input id="v-nonce" type="number" min="0" step="1" value="0" class="num">
        </div>
      </div>

      <button class="btn big" id="compute" data-t="verify_compute"></button>

      <div id="output" hidden>
        <div class="kv" id="hash-row">
          <span class="k" data-t="verify_hash_of_seed"></span>
          <code class="seed-box num" id="computed-hash"></code>
          <span id="hash-verdict" class="hash-verdict"></span>
        </div>
        <div class="results-duo">
          <div class="kv">
            <span class="k" data-t="verify_computed"></span>
            <div class="result-card num" id="computed-result"></div>
          </div>
          <div class="kv" id="recorded-wrap" hidden>
            <span class="k" data-t="verify_recorded"></span>
            <div class="result-card num" id="recorded-result"></div>
          </div>
        </div>
        <div id="verdict" class="verdict" hidden></div>
      </div>
    </section>
  </main>
  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/verify.js"></script>
</body>
</html>
