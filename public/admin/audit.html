<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_admin_audit">აუდიტის ჟურნალი — დეშბორდი</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="adm_audit_heading"></h1>
    </div>
    <section class="panel table-panel">
      <table class="data">
        <thead>
          <tr>
            <th data-t="adm_col_when"></th>
            <th data-t="adm_col_player"></th>
            <th data-t="adm_col_admin"></th>
            <th class="num" data-t="adm_col_before"></th>
            <th class="num" data-t="adm_col_delta"></th>
            <th class="num" data-t="adm_col_after"></th>
            <th data-t="adm_col_note"></th>
          </tr>
        </thead>
        <tbody id="audit-body"></tbody>
      </table>
      <p id="audit-empty" class="muted" data-t="adm_audit_empty" hidden></p>
    </section>
    <div class="pager">
      <button class="btn ghost small" id="prev" data-t="pager_prev"></button>
      <span class="num" id="page-info"></span>
      <button class="btn ghost small" id="next" data-t="pager_next"></button>
    </div>
  </main>
  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/admin-audit.js"></script>
</body>
</html>
