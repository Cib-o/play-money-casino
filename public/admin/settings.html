<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_admin_settings">პარამეტრები — დეშბორდი</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="adm_settings_heading"></h1>
    </div>
    <section class="panel">
      <form id="settings-form" class="form-grid" novalidate>
        <div class="form-row">
          <label for="s-rtp" data-t="adm_rtp"></label>
          <input id="s-rtp" type="number" min="0.80" max="0.99" step="0.01" required>
          <p class="muted hint" data-t="adm_rtp_hint"></p>
        </div>
        <div class="form-row">
          <label for="s-site" data-t="adm_site_name"></label>
          <input id="s-site" type="text" maxlength="40" required>
        </div>
        <!-- Credits, to two places: the floor the house can set is 0.01. -->
        <div class="form-row">
          <label for="s-min" data-t="adm_min_bet"></label>
          <input id="s-min" type="number" min="0.01" step="0.01" required>
          <p class="muted hint" data-t="adm_bet_hint"></p>
        </div>
        <div class="form-row">
          <label for="s-max" data-t="adm_max_bet"></label>
          <input id="s-max" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="form-row">
          <label for="s-balance" data-t="adm_default_balance"></label>
          <input id="s-balance" type="number" min="0" step="0.01" required>
        </div>
        <div class="form-row">
          <label for="s-locale" data-t="adm_default_locale"></label>
          <select id="s-locale">
            <option value="ka" data-t="lang_ka"></option>
            <option value="en" data-t="lang_en"></option>
          </select>
        </div>
        <div class="form-row">
          <label for="s-maxbots" data-t="adm_max_bots"></label>
          <input id="s-maxbots" type="number" min="0" max="6" step="1" required>
          <p class="muted hint" data-t="adm_max_bots_hint"></p>
        </div>
        <div class="form-row full">
          <label data-t="adm_games"></label>
          <div id="games-toggles" class="chip-row"></div>
        </div>
        <div class="full">
          <button class="btn" type="submit" data-t="save"></button>
        </div>
      </form>
    </section>

    <!-- Its own panel, well below the save button, so nothing in here
         is ever a neighbour of an ordinary edit. -->
    <section class="panel danger-zone">
      <h2 data-t="adm_danger_heading"></h2>
      <div class="danger-row">
        <div>
          <strong data-t="adm_reset_title"></strong>
          <p class="muted hint" data-t="adm_reset_hint"></p>
        </div>
        <button class="btn danger" id="reset-open" type="button" data-t="adm_reset_btn"></button>
      </div>
    </section>
  </main>

  <dialog id="reset-dialog">
    <div class="dialog-head">
      <h2 data-t="adm_reset_title"></h2>
      <button class="btn ghost small" data-t="close" data-close></button>
    </div>
    <p class="lose-text" data-t="adm_reset_wipes"></p>
    <p class="muted" data-t="adm_reset_keeps"></p>
    <p class="muted" data-t="adm_reset_refund"></p>
    <div class="form-row">
      <label for="reset-token"><span data-t="adm_reset_type"></span> <code id="reset-word"></code></label>
      <input id="reset-token" type="text" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn danger" id="reset-confirm" type="button" data-t="adm_reset_confirm_btn" disabled></button>
  </dialog>

  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/admin-settings.js"></script>
</body>
</html>
