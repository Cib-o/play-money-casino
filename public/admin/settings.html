<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_admin_settings">პარამეტრები — დეშბორდი</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="adm_settings_heading"></h1>
    </div>
    <section class="panel">
      <form id="settings-form" class="form-grid" novalidate>
        <div class="form-row">
          <label for="s-rtp" data-t="adm_rtp"></label>
          <input id="s-rtp" type="number" min="0.80" max="0.99" step="0.01" required>
          <p class="muted hint" data-t="adm_rtp_hint"></p>
        </div>
        <div class="form-row">
          <label for="s-site" data-t="adm_site_name"></label>
          <input id="s-site" type="text" maxlength="40" required>
        </div>
        <div class="form-row">
          <label for="s-min" data-t="adm_min_bet"></label>
          <input id="s-min" type="number" min="1" step="1" required>
        </div>
        <div class="form-row">
          <label for="s-max" data-t="adm_max_bet"></label>
          <input id="s-max" type="number" min="1" step="1" required>
        </div>
        <div class="form-row">
          <label for="s-balance" data-t="adm_default_balance"></label>
          <input id="s-balance" type="number" min="0" step="1" required>
        </div>
        <div class="form-row">
          <label for="s-locale" data-t="adm_default_locale"></label>
          <select id="s-locale">
            <option value="ka" data-t="lang_ka"></option>
            <option value="en" data-t="lang_en"></option>
          </select>
        </div>
        <div class="form-row">
          <label for="s-maxbots" data-t="adm_max_bots"></label>
          <input id="s-maxbots" type="number" min="0" max="6" step="1" required>
          <p class="muted hint" data-t="adm_max_bots_hint"></p>
        </div>
        <div class="form-row full">
          <label data-t="adm_games"></label>
          <div id="games-toggles" class="chip-row"></div>
        </div>
        <div class="full">
          <button class="btn" type="submit" data-t="save"></button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/admin-settings.js"></script>
</body>
</html>
