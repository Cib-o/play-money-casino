<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_slots">სლოტები</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/slots.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="title_slots"></h1>
      <button class="btn ghost small" id="back-btn" type="button" hidden data-t="slot_back"></button>
    </div>

    <section id="floor">
      <p class="floor-hint muted" data-t="slot_floor_hint"></p>
      <div class="slot-grid" id="slot-grid"></div>
    </section>

    <section id="cabinet" hidden>
      <div class="game-layout">
        <section class="panel cab" id="cab">
          <div class="cab-head">
            <span class="cab-art" id="cab-art"></span>
            <div class="cab-titles">
              <div class="cab-name" id="cab-name"></div>
              <div class="cab-sub" id="cab-sub"></div>
            </div>
            <span class="vol-badge" id="cab-vol"></span>
          </div>

          <div class="cab-screen">
            <div class="reel-grid" id="reel-grid">
              <svg class="line-overlay" id="line-overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
            <div class="cab-glass"></div>
          </div>

          <div class="cab-readout">
            <span class="mult-badge num" id="mult-badge"></span>
            <span class="net-value num" id="net-value"></span>
          </div>
          <ul class="win-list" id="win-list"></ul>
        </section>

        <aside class="panel bet-box">
          <div id="bet-control"></div>
          <button class="btn big spin-btn" id="spin-btn" data-t="btn_spin"></button>
          <div>
            <label data-t="last_results"></label>
            <div class="strip" id="strip"></div>
          </div>
          <dl class="facts" id="facts"></dl>
          <details>
            <summary data-t="paytable"></summary>
            <table class="data paytable">
              <thead id="paytable-head"></thead>
              <tbody id="paytable-body"></tbody>
            </table>
            <p class="pay-note muted" id="pay-note"></p>
          </details>
        </aside>
      </div>
    </section>
  </main>
  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/slots.js"></script>
</body>
</html>
