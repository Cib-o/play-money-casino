<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="title_blackjack">ბლექჯეკი</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/blackjack.css">
</head>
<body>
  <header class="site" id="app-header"></header>
  <main class="container">
    <div class="page-head">
      <h1 data-t="title_blackjack"></h1>
      <span class="muted" data-t="bj_pays"></span>
    </div>

    <section class="bj-stage">
      <div class="bj-felt">
        <div class="bj-dealer-zone">
          <div class="bj-dealer-plate">
            <span class="bj-dealer-avatar">🎩</span>
            <span data-t="bj_dealer_name"></span>
            <span>·</span>
            <span class="bj-dealer-name" id="dealer-name"></span>
          </div>
          <div class="bj-dealer-hand" id="dealer-hand"></div>
          <div class="bj-dealer-total" id="dealer-total"></div>
        </div>

        <div class="bj-discard" title="discard"></div>
        <div class="bj-shoe" id="shoe"></div>
        <div class="bj-shoe-count num" id="shoe-count"></div>

        <div class="bj-arc-text">
          <span data-t="title_blackjack"></span>
          <span class="rule" data-t="bj_pays"></span>
        </div>

        <div class="bj-status" id="status">
          <span id="status-text"></span>
          <span class="count" id="status-count"></span>
        </div>

        <div class="bj-seats" id="seats"></div>
      </div>

      <div class="bj-dock">
        <div class="bj-rack" id="rack"></div>

        <div class="bj-actions" id="actions" hidden>
          <button class="bj-act hit" id="hit-btn" type="button">
            <span class="ring">✚</span><span data-t="btn_hit"></span>
          </button>
          <button class="bj-act double" id="double-btn" type="button">
            <span class="ring">×2</span><span data-t="btn_double"></span>
          </button>
          <button class="bj-act stand" id="stand-btn" type="button">
            <span class="ring">✋</span><span data-t="btn_stand"></span>
          </button>
        </div>

        <div class="bj-primary">
          <div class="bj-info">
            <span><span data-t="bj_total_bet"></span>: <strong class="num" id="total-bet">0</strong></span>
          </div>
          <button class="btn ghost small" id="clear-btn" type="button" data-t="bj_clear"></button>
          <button class="btn small" id="leave-btn" type="button" hidden data-t="bj_leave_table"></button>
        </div>

        <div class="bj-limits" id="limits"></div>
      </div>
    </section>
  </main>

  <footer class="site" id="app-footer"></footer>
  <div id="toast-root"></div>
  <script type="module" src="/js/pages/blackjack.js"></script>
</body>
</html>
